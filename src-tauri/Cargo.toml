[package]
name = "agent-browser-monitor"
version = "0.1.0-rc.1"
description = "Local agent-browser process monitor"
edition = "2021"

[lib]
name = "agent_browser_monitor_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.0", features = [] }
